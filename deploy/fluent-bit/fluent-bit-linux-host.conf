# Optional collector for a LINUX host (SSH/sudo/auth logs and kernel firewall logs).
# Run Fluent Bit on the Linux host (or as a container with /var/log mounted read-only) with:
#   SIEM_API_HOST, SIEM_API_PORT, SIEM_INGEST_KEY, SIEM_HOST_NAME set in its environment.
# Kernel firewall lines (iptables/nftables LOG rule with SRC=/DST=/DPT=) enable the port-scan rule.
[SERVICE]
    Flush        2
    Log_Level    info

[INPUT]
    Name   tail
    Tag    linux.auth
    Path   /var/log/auth.log,/var/log/secure
    DB     /var/lib/fluent-bit/linux-auth.db
    Skip_Long_Lines On

[INPUT]
    Name   tail
    Tag    linux.fw
    Path   /var/log/kern.log
    DB     /var/lib/fluent-bit/linux-kern.db
    Skip_Long_Lines On

[OUTPUT]
    Name        http
    Match       linux.*
    Host        ${SIEM_API_HOST}
    Port        ${SIEM_API_PORT}
    URI         /api/ingest
    Format      json
    tls         Off
    Header      X-Ingest-Key ${SIEM_INGEST_KEY}
    Header      X-Source-Type linux
    Header      X-Source-Host ${SIEM_HOST_NAME}
    Header      X-Collector fluent-bit-linux
    Retry_Limit 10
