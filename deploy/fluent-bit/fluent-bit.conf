[SERVICE]
    Flush                     2
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    # Disk buffering so interrupted ingestion resumes after restarts
    storage.path              /var/fluent-bit/state/buffer
    storage.sync              normal
    storage.backlog.mem_limit 32MB

# --- Docker container logs (json-file driver). Backend + Fluent Bit use the 'local' driver and are excluded.
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /var/fluent-bit/state/docker.db
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    storage.type      filesystem

# --- Nginx access / error logs (shared volume written by the frontend container)
[INPUT]
    Name              tail
    Tag               nginx.access
    Path              /var/log/nginx/siem-access.log
    DB                /var/fluent-bit/state/nginx-access.db
    Mem_Buf_Limit     8MB
    Skip_Long_Lines   On
    storage.type      filesystem

[INPUT]
    Name              tail
    Tag               nginx.error
    Path              /var/log/nginx/siem-error.log
    DB                /var/fluent-bit/state/nginx-error.db
    Mem_Buf_Limit     8MB
    Skip_Long_Lines   On
    storage.type      filesystem

[OUTPUT]
    Name              http
    Match             nginx.*
    Host              backend
    Port              8000
    URI               /api/ingest
    Format            json
    Header            X-Ingest-Key ${SIEM_INGEST_KEY}
    Header            X-Source-Type nginx
    Header            X-Source-Host ${SIEM_HOST_NAME}
    Header            X-Collector fluent-bit-nginx
    Retry_Limit       10
    storage.total_limit_size 256M

[OUTPUT]
    Name              http
    Match             docker.*
    Host              backend
    Port              8000
    URI               /api/ingest
    Format            json
    Header            X-Ingest-Key ${SIEM_INGEST_KEY}
    Header            X-Source-Type docker
    Header            X-Source-Host ${SIEM_HOST_NAME}
    Header            X-Collector fluent-bit-docker
    Retry_Limit       10
    storage.total_limit_size 256M
