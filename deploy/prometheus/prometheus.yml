global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: siem-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: fluent-bit
    metrics_path: /api/v1/metrics/prometheus
    static_configs:
      - targets: ["fluent-bit:2020"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
