name: CD

# Publishes versioned images to GHCR on every push to main and every v* tag, and (optionally) deploys a chosen
# version to a protected GitHub Environment. Rollback = re-run with an older version (see docs/DEVOPS.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy (e.g. sha-abc1234 or v1.2.0). Leave empty to build+deploy HEAD."
        required: false
      environment:
        description: "Target GitHub Environment"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: cd-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NS: ${{ github.repository }}

jobs:
  publish:
    name: Build & push images
    if: ${{ !inputs.version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        id: push
        with:
          context: backend
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}-backend:${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        id: push-fe
        with:
          context: frontend
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}-frontend:${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Scan the published images
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}-backend:${{ steps.ver.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Summary
        run: |
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${REGISTRY}/${IMAGE_NS}-backend:${{ steps.ver.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${REGISTRY}/${IMAGE_NS}-frontend:${{ steps.ver.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ needs.publish.outputs.version || inputs.version }}
    needs: [publish]
    # runs for manual dispatches (with or without a build) and release tags; push to main only publishes
    if: ${{ always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'production' }} # configure required reviewers on the Environment
    env:
      VERSION: ${{ inputs.version || needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        id: cfg
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          K: ${{ secrets.DEPLOY_SSH_KEY }}
          U: ${{ secrets.DEPLOY_USER }}
        run: |
          if [[ -z "$H" || -z "$K" || -z "$U" ]]; then
            echo "::warning::DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY are not configured for this environment - deployment SKIPPED (images were still published)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else echo "configured=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy over SSH
        if: steps.cfg.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/siem' }}
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'http://127.0.0.1:8080/readyz' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE_NS_VALUE: ${{ github.repository }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/id_deploy $DEPLOY_USER@$DEPLOY_HOST"
          scp -i ~/.ssh/id_deploy docker-compose.yml docker-compose.prod.yml scripts/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          scp -i ~/.ssh/id_deploy -r deploy "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          # secrets are passed on stdin, never on the command line / in logs
          printf '%s\n%s\n' "$GHCR_USER" "$GHCR_TOKEN" | $SSH "cd $DEPLOY_PATH && chmod +x deploy.sh && IMAGE_NS='$IMAGE_NS_VALUE' HEALTH_URL='$HEALTH_URL' ./deploy.sh '$VERSION'"
      - name: Record deployment
        if: steps.cfg.outputs.configured == 'true'
        run: echo "Deployed $VERSION to ${{ inputs.environment || 'production' }}" >> "$GITHUB_STEP_SUMMARY"
