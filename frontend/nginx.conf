# Serves the SPA and reverse-proxies the API. Logs go to a shared volume so Fluent Bit can collect them.
access_log /var/log/nginx/siem-access.log;
access_log /dev/stdout;
error_log  /var/log/nginx/siem-error.log warn;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # Status-only probes for load balancers and deployment health verification.
    location = /healthz { access_log off; proxy_pass http://backend:8000/healthz; }
    location = /readyz { access_log off; proxy_pass http://backend:8000/readyz; }

    # Never expose internal-only endpoints through the public proxy.
    location = /metrics { return 404; }
    location /api/docs { return 404; }
    location = /api/openapi.json { return 404; }

    location /api/events/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-store"; }
}
